[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/oyster-lookup/domain.md"]

[build.environment]
  NODE_VERSION = "22"

# Sign-in passes through this site so Neon Auth's cookie is first-party (see
# src/lib/db.js). Must come before the SPA fallback.
[[redirects]]
  from = "/neon-auth/*"
  to = "https://ep-jolly-wind-bdjeuzu7.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
